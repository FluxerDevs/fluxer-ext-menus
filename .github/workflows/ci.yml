name: Package checks

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install build and test tools
        run: python -m pip install build twine pytest pytest-asyncio ruff
      - name: Lint
        run: python -m ruff check .
      - name: Build source archive and wheel
        run: python -m build
      - name: Check PyPI metadata and README
        run: python -m twine check --strict dist/*
      - name: Install the built wheel with published dependencies
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', *glob.glob('dist/*.whl')])"
      - name: Test installed package
        run: python -m pytest
      - name: Check isolated import and distribution version
        run: python -I -c "from importlib.metadata import version; from fluxer.ext import menus; assert menus.__version__ == version('fluxer-ext-menus'); print(menus.__file__)"
      - name: Save release distributions
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
